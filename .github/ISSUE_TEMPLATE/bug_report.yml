name: Bug report
description: Something doesn't work
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: App version
      description: Help → About shows it
      placeholder: "1.9.0"
    validations: { required: true }
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Windows, macOS Apple Silicon, macOS Intel, Linux x86_64, Linux ARM64, From source]
    validations: { required: true }
  - type: input
    id: theme
    attributes:
      label: Theme, System Menu version and region
      placeholder: "Black Pirate, 4.3U, nospin"
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead
    validations: { required: true }
  - type: textarea
    id: log
    attributes:
      label: Log panel output
      description: Copy everything from the log panel at the bottom of the app
      render: text
